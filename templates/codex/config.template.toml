# AccessMCP — OpenAI Codex CLI
#
# Merge this table into ~/.codex/config.toml (on Windows:
# %USERPROFILE%\.codex\config.toml). Keep everything else in that file.
#
# Single quotes make this a TOML *literal* string, so the Windows backslashes
# need no escaping. If your user name contains an apostrophe, use a basic
# string instead and double every backslash:
#   command = "C:\\Users\\O'Brien\\AppData\\Local\\Programs\\AccessMCP\\accessmcp.exe"

# One server per database, named after the file in the dash form (no dot:
# YourDatabase-accdb), which works quoted or not. A second database is a second
# table with its own name and its own path in args. The object tree and every
# agent on the same database share one Access process; add '--standalone' to
# args to opt out.
[mcp_servers."YourDatabase-accdb"]
command = 'C:\Users\YOU\AppData\Local\Programs\AccessMCP\accessmcp.exe'
args = ['C:\Data\YourDatabase.accdb']

# Optional, all verified fields of a stdio server entry:
#   env = { SOME_VAR = "value" }     # environment for the server process
#   startup_timeout_sec = 30         # startup + initial tool listing
#   tool_timeout_sec = 120           # default per-tool-call timeout
#   enabled = false                  # keep the entry, skip starting it
